name: Generate contribution snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-live.svg?palette=github-dark&color_snake=white
            dist/snake-live-dark.svg?palette=github-dark&color_snake=white
      - name: Trim snake (drop progress bar + crop bottom gap)
        run: |
          for f in dist/*.svg; do
            sed -i 's/192"/146"/g' "$f"
            sed -i 's#<rect class="u[^>]*/>##g' "$f"
          done
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
